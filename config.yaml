project:
  name: "Analista"
  version: "0.1.1"
  description: "Scanner para detectar setups long-only de swing trading en acciones comunes estadounidenses."

strategy:
  direction: "long_only"
  horizon_days:
    min: 4
    max: 21
  portfolio_construction: false
  execution_mode: "manual_review"

trading_profile:
  market: "US"
  asset_class: "common_stocks"
  direction: "long_only"
  holding_period_min_days: 4
  holding_period_ideal_days: [4, 21]
  allow_etfs_as_tradable_assets: false
  allow_etfs_as_benchmarks: true

universe:
  mode: "us_listed_common_equities"

  allowed_exchanges: ["NMS", "NYQ", "ASE", "NAS", "NYE"]
  allowed_quote_types: ["EQUITY"]
  allow_adrs: true
  allow_foreign_issuers_listed_in_us: true
  min_history_days: 252

  allow:
    - stocks_listed_in_us_exchanges
    - liquid_adrs
    - liquid_foreign_issuers_listed_in_us

  exclude_security_types:
    - ETF
    - ETN
    - closed_end_fund
    - preferred_share
    - warrant
    - rights
    - unit
    - mutual_fund
    - SPAC_pre_deal
    - illiquid_ADR

  exclude_name_contains:
    - "ETF"
    - "ETN"
    - "Fund"
    - "Trust"
    - "Preferred"
    - "Warrant"
    - "Unit"
    - "Right"

filters:
  min_price: 10
  min_market_cap_usd: 2500000000

screener:
  max_results_per_query: 250
  target_size: 0
  page_size: 250
  sort_field: "avgdailyvol3m"
  sort_asc: false
  max_universe_after_dedupe: 0
  max_pages_per_custom_query: 40
  deduplicate_results: true

  custom_queries:
    custom_liquid_universe:
      enabled: true
      min_market_cap_usd: 2500000000
      min_price: 10
      min_avg_volume_3m: 0
      exchanges: ["NMS", "NYQ", "ASE"]
      target_size: 0
      page_size: 250
      sort_field: "avgdailyvol3m"
      sort_asc: false

    custom_large_liquid_leaders:
      enabled: true
      min_market_cap_usd: 10000000000
      min_price: 10
      min_avg_volume_3m: 0
      exchanges: ["NMS", "NYQ", "ASE"]
      target_size: 0
      page_size: 250
      sort_field: "intradaymarketcap"
      sort_asc: false

  fallback_tickers:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - AVGO
    - AMD
    - CRM
    - ORCL
    - NFLX
    - COST
    - LLY
    - JPM
    - GE
    - PLTR
    - ANET
    - CRWD
    - NOW
    - SMCI

  channels:
    day_gainers:
      enabled: false
      max_results: 250

    most_actives:
      enabled: false
      max_results: 250

    growth_technology_stocks:
      enabled: false
      max_results: 250

    undervalued_growth_stocks:
      enabled: false
      max_results: 250

    undervalued_large_caps:
      enabled: false
      max_results: 250

    most_institutionally_bought_large_cap_stocks:
      enabled: false
      max_results: 250

    small_cap_gainers:
      enabled: false
      max_results: 150

  channel_source_weights:
    custom_liquid_universe: 1.00
    custom_large_liquid_leaders: 0.90
    day_gainers: 0.35
    most_actives: 0.40
    growth_technology_stocks: 0.50
    undervalued_growth_stocks: 0.45
    undervalued_large_caps: 0.45
    most_institutionally_bought_large_cap_stocks: 0.45
    small_cap_gainers: 0.55

  bias_control:
    max_single_source_share: 0.45
    max_top_sector_share: 0.40
    max_momentum_sources_share: 0.60
    momentum_sources:
      - day_gainers
      - most_actives
      - small_cap_gainers

liquidity:
  min_price: 10
  min_dollar_volume_20d: 20000000
  min_dollar_volume_60d: 15000000
  min_median_to_mean_volume_ratio: 0.50
  use_market_cap_adjusted_liquidity: true
  market_cap_tiers:
    mega: 100000000000
    large: 10000000000
    mid: 2500000000
  min_turnover_20d:
    mega: 0.00025
    large: 0.00045
    mid: 0.00080
    default: 0.00080
  min_turnover_60d:
    mega: 0.00020
    large: 0.00035
    mid: 0.00065
    default: 0.00065
  max_bid_ask_spread_pct: 0.01
  max_quote_distance_pct: 0.10
  invalid_bid_ask_score: 0.50

benchmarks:
  broad_market: "SPY"
  growth_market: "QQQ"
  small_caps: "IWM"
  volatility: "^VIX"
  us10y: "^TNX"
  us30y: "^TYX"
  dollar: "DX-Y.NYB"
  crude_oil: "CL=F"
  bitcoin: "BTC-USD"

sector_context:
  enabled: true
  data_source: "yfinance"
  daily_period: "1y"
  daily_interval: "1d"
  min_weeks: 35
  weekly_rule: "W-FRI"
  macd:
    fast: 12
    slow: 26
    signal: 9
  benchmark_etfs:
    Technology: "XLK"
    Financial Services: "XLF"
    Industrials: "XLI"
    Consumer Cyclical: "XLY"
    Consumer Defensive: "XLP"
    Healthcare: "XLV"
    Energy: "XLE"
    Basic Materials: "XLB"
    Utilities: "XLU"
    Real Estate: "XLRE"
    Communication Services: "XLC"
    Finance: "XLF"
    Technology Services: "XLK"
    Electronic Technology: "XLK"
    Health Technology: "XLV"
    Producer Manufacturing: "XLI"
    Consumer Services: "XLY"
    Non-Energy Minerals: "XLB"
    Consumer Non-Durables: "XLP"
    Retail Trade: "XLY"
    Industrial Services: "XLI"
    Transportation: "XLI"
    Commercial Services: "XLI"
    Energy Minerals: "XLE"
    Process Industries: "XLB"
    Consumer Durables: "XLY"
    Communications: "XLC"
    Health Services: "XLV"
    Distribution Services: "XLI"
    Miscellaneous: "SPY"

market_regime:
  risk_on:
    min_score: 6
    min_candidate_score: 75
  neutral:
    min_score: 4
    min_candidate_score: 82
  risk_off:
    max_score: 3
    min_candidate_score: 90
    block_new_longs: true
  vix:
    low_risk_below: 16
    high_risk_above: 25

price_data:
  daily_period: "1y"
  daily_interval: "1d"
  batch_size: 150
  retry_batch_size: 50
  timeout_seconds: 15
  max_individual_fallbacks: 10
  cache_dir: "cache/prices/daily"
  cache_ttl_minutes: 30
  max_stale_hours: 120
  technical_bar_policy: "CLOSED_DAILY_AND_WEEKLY_ONLY"

deep_analysis:
  mode: "shadow"
  candidate_funnel:
    target_tickers: 0
    min_tickers: 0
    max_tickers: 5000
    max_sector_share: 1.00
  scenario_engine:
    promotion_enabled: false
    target_success_primary: true

opportunity_model:
  version: "INSTITUTIONAL_OPPORTUNITY_V2"
  tactical_research_min_score: 68
  reset_watch_min_score: 72
  max_research_extension_risk: 0.72
  execution_requires_macd_operable_daily_weekly: true
  no_forced_candidate_quota: true

indicators:
  moving_averages: [20, 50, 200]
  rsi:
    period: 14
    healthy_min: 55
    healthy_max: 70
    overextended: 75
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr:
    period: 14
  volume:
    avg_period: 20
    relative_volume_breakout_min: 1.30
    relative_volume_strong_min: 1.50
  obv:
    slope_period: 20

relative_strength:
  windows:
    short_days: 20
    medium_days: 63
  benchmarks:
    market: "SPY"
    growth: "QQQ"

trend:
  scoring:
    close_above_ma20: 0.20
    close_above_ma50: 0.25
    close_above_ma200: 0.25
    ma20_above_ma50: 0.15
    ma50_above_ma200: 0.15
  thresholds:
    excellent: 0.85
    acceptable: 0.70
    weak: 0.55

setups:
  breakout:
    min_relative_volume: 1.30
    lookback_resistance: 20
  pullback:
    max_distance_to_ma_pct: 0.025
  reclaim:
    min_relative_volume: 1.10
  volatility_contraction:
    min_compression_ratio: 0.75
  macd_momentum:
    enabled: true
    min_rsi: 50
    max_rsi: 72
    max_rsi_overextended: 75
    min_relative_volume: 0.80
    max_distance_ema20_pct: 0.055
    max_distance_ema20_atr: 1.75
    require_weekly_macd_non_bearish: true

risk_reward:
  atr_stop_multiplier: 1.5
  min_rr_absolute: 1.5
  min_rr_acceptable: 1.7
  min_rr_ideal: 2.0
  model_confluence_tolerance_pct: 0.25

risk_profile:
  mode: "aggressive"

  stop_atr_multiple:
    hard_min: 0.60
    preferred_min: 1.00
    preferred_max: 2.50

  tight_stop_policy:
    below_hard_min_action: "avoid"
    below_preferred_action: "penalize_only"

data_sources:
  cache_ttl_minutes:
    fundamentals: 10080
    earnings: 720
    options: 30
  analysis_quotes:
    enabled: true
    max_tickers_per_run: 500
    alpaca_batch_size: 100
    timeout_seconds: 15
    use_alpaca_iex: true
    use_google_sheets_manual: true
  providers:
    market_data_engine:
      enabled: true
      priority: 0
      mode: "read_only_eod"
      data_freshness: "EOD"
      drive_db_path: "G:/Mi unidad/MarketData/us_market_5y/master/us_market_5y.db"
      drive_manifest_path: "G:/Mi unidad/MarketData/us_market_5y/manifests/master_manifest.json"
      local_cache_path: "cache/market_data_engine/us_market_5y.db"
      local_manifest_path: "cache/market_data_engine/master_manifest.json"
      max_stale_days: 7
      min_latest_coverage: 0.95
    yahoo:
      enabled: true
      priority: 1
      mode: "primary"
      data_freshness: "UNKNOWN"
    alpaca_iex:
      enabled: true
      priority: 2
      mode: "read_only"
      data_freshness: "DELAYED_15_MIN"
      data_base_url: "https://data.alpaca.markets"
    webull:
      enabled: false
      priority: 3
      mode: "read_only"
      data_freshness: "UNKNOWN"
      base_url: "https://api.webull.com"
      test_symbol: "AAPL"
    cboe:
      enabled: true
      mode: "read_only"
      data_freshness: "EOD"
      market_share_url: "https://www.cboe.com/us/options/market_share/market/csv/"
      total_put_call_url: "https://cdn.cboe.com/resources/options/volume_and_call_put_ratios/totalpc.csv"
      equities_market_volume_url: "https://cdn.cboe.com/resources/us/equities/market-statistics/historical-market-volume/market_history_2026.csv"
    google_sheets_manual:
      enabled: true
      mode: "read_only"
      data_freshness: "DELAYED_20_MIN"
      published_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR3Wq27cyOLpoocdVjvtFCHTTR5hD_489zl4FIfk9S8JiPmTkNwHX8FbSsusF2XvQ/pub?gid=1907410928&single=true&output=csv"
      timeout_seconds: 20
      max_stale_minutes: 1440
    fred:
      enabled: true
      mode: "read_only"
      data_freshness: "MIXED_OFFICIAL_RELEASE_FREQUENCIES"
      timeout_seconds: 20
      retries: 3
      backoff_factor: 0.6
      cache_path: "cache/macro/fred_latest.json"

data_quality:
  critical_missing_penalty: 0.20
  important_missing_penalty: 0.03

fundamentals:
  enabled: true
  metadata_enrichment:
    enabled: true
    max_tickers: 0
    prefer_stale_cache: true
    max_network_queries_per_run: 50
  earnings_risk:
    veto_if_days_to_earnings_lte: 3
    penalize_if_days_to_earnings_lte: 7

performance:
  scan_report_path: "reports/scan_performance_latest.json"

options_flow:
  enabled: true
  use_as_confirmation_only: true
  max_tickers_per_run: 75
  max_expirations: 3
  min_days_to_expiration: 3
  max_days_to_expiration: 45
  near_moneyness_pct: 0.08
  min_total_option_volume: 100
  min_total_option_open_interest: 1000
  extreme_bullish_put_call_below: 0.35
  cache_ttl_minutes: 30
  weights:
    put_call_volume_ratio: 0.25
    call_volume_share: 0.20
    near_call_oi_share: 0.20
    call_wall_position: 0.15
    iv_risk: 0.10
    options_liquidity: 0.10
  medium_total_option_volume: 300
  medium_total_option_open_interest: 1000
  high_total_option_volume: 1000
  high_total_option_open_interest: 5000
  crowded_bullish_score_cap: 0.60
  crowded_bullish_bias: "NEUTRAL_CROWDED"

scoring_weights:
  relative_strength: 11.4
  trend: 11.0
  market_regime: 10.7
  volume_accumulation: 10.3
  sector_rotation: 9.5
  structure_trigger: 9.0
  risk_reward_atr: 8.4
  liquidity: 7.6
  momentum: 6.9
  options_flow: 6.1
  fundamentals: 5.1
  sentiment: 4.0

signals:
  buy_setup_active_enabled: false
  allowed_states:
    - VETO
    - AVOID
    - WATCHLIST
    - READY_WAIT_TRIGGER
    - TRIGGER_CONFIRMED

signal_thresholds:
  buy_setup_active:
    enabled: false
    min_score: 85
    require_trigger: true
    min_rr: 2.0

  trigger_confirmed:
    min_score: 85
    require_trigger: true
    min_rr: 2.0

  ready_wait_trigger:
    min_score: 80
    require_trigger: false
    min_rr: 1.7

  watchlist:
    min_score: 70

veto_rules:
  thresholds:
    min_rr: 1.5
  data_quality:
    veto_low_confidence: true
    veto_missing_critical: true
  veto_invalid_bid_ask: false

outputs:
  files:
    latest_scan: "reports/latest_scan.json"
    latest_csv: "reports/latest_scan.csv"
    history_dir: "reports/history"

logging:
  level: "INFO"
  file: "logs/scanner.log"
  log_to_console: true

development:
  save_raw_screener_response: true
  fail_soft_on_missing_data: true

operational_priority:
  data_quality_weight: 0.30
  liquidity_weight: 0.20
  source_quality_weight: 0.20
  options_confidence_weight: 0.15
  bid_ask_weight: 0.05
  crowded_penalty_weight: 0.10

  data_confidence_factor:
    HIGH: 1.00
    MEDIUM: 0.88
    LOW: 0.65
    DEFAULT: 0.80

  options_confidence_factor:
    HIGH: 1.00
    MEDIUM: 0.92
    LOW: 0.82
    DEFAULT: 0.90

  missing_bid_ask_factor: 0.92
  invalid_bid_ask_factor: 0.88
  crowded_bullish_factor: 0.88
  recoverable_veto_factor: 0.55

  signal_factor:
    BUY_SETUP_ACTIVE: 1.00
    READY_WAIT_TRIGGER: 0.94
    WATCHLIST: 0.86
    AVOID: 0.65
    VETO: 0.35
    DEFAULT: 0.75

  pre_veto_signal_factor:
    BUY_SETUP_ACTIVE: 1.00
    READY_WAIT_TRIGGER: 0.96
    WATCHLIST: 0.90
    AVOID: 0.75
    VETO: 0.60
    DEFAULT: 0.80
