# Fusionar dentro de config.yaml si no reemplazas el archivo completo

universe:
  strict_post_enrichment: true
  allow_missing_quote_type_after_enrichment: false

data_quality:
  critical_missing_penalty: 0.08
  important_missing_penalty: 0.025
  critical_fields:
    - ticker
    - price
    - sector
    - industry
    - market_cap
    - avg_volume_20d
    - dollar_volume_20d
    - liquidity_pass
    - trend_score
    - rr
    - setup_type
  important_fields:
    - earnings_date
    - days_to_earnings
    - revenue_growth
    - earnings_growth
    - operating_margins
    - debt_to_equity
    - return_on_equity
    - options_score
    - options_bias
    - put_call_volume_ratio
    - put_call_oi_ratio
